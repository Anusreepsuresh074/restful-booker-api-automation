name: CI

# Lint gates everything. Every push / PR runs the fast smoke suite; the full regression
# suite runs nightly and on demand. Every non-PR run publishes an Allure report (with
# run-over-run history) to GitHub Pages.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
# AUTH_USERNAME and AUTH_PASSWORD — the published demo credentials POST /auth needs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
  AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  smoke:
    name: Smoke suite (PR gate)
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # publish the JUnit test summary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          pytest -m smoke
          --env=dev
          -n auto --dist loadscope
          --reruns 2 --reruns-delay 5
          --junitxml=reports/junit.xml
      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit.xml
          check_name: Test results (smoke)
          detailed_summary: true
          include_passed: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-smoke
          path: reports/allure-results/
          retention-days: 14

  regression:
    name: Full regression suite
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          pytest -m regression
          --env=dev
          -n auto --dist loadscope
          --reruns 2 --reruns-delay 5
          --junitxml=reports/junit.xml
      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit.xml
          check_name: Test results (regression)
          detailed_summary: true
          include_passed: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-regression
          path: reports/allure-results/
          retention-days: 14

  # Builds the Allure report, keeps run-over-run history (trend graphs) and
  # publishes it to GitHub Pages (gh-pages branch). Skipped for pull requests.
  # One-time repo setup: Settings -> Pages -> Deploy from branch -> gh-pages.
  allure-report:
    needs: [smoke, regression]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Fetch previous report (for history)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/; fi
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
